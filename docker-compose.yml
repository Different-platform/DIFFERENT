services:
  db:
    image: pgvector/pgvector:pg16
    container_name: differ-db
    environment:
      POSTGRES_USER: differ
      POSTGRES_PASSWORD: differ
      POSTGRES_DB: differ
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U differ -d differ"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
